services:

  app:
    build: .
    container_name: frameworkphp_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www

  nginx:
    image: nginx:latest
    container_name: framework_nginx
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: framework_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: framework
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: framework
      MYSQL_PASSWORD: secret
    ports:
      - "3301:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: